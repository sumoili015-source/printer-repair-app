
name: Build Printer Repair APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: unzip -o PrinterRepairAndroid_Project.zip -d .

      - name: Build APK
        run: |
          cd PrinterRepairAndroid
          gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: markaz-al-siyana-apk
          path: PrinterRepairAndroid/app/build/outputs/apk/debug/app-debug.apk
